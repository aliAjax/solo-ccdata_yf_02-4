<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>评审白板 · Review Board</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 入口页：创建 / 加入评审 -->
<div id="landing" class="landing" hidden>
  <div class="landing-card">
    <div class="brand"><div class="dot">R</div><div><b>评审白板</b><small>带角色与阶段门禁的协作评审空间</small></div></div>
    <div class="landing-tabs">
      <button class="ltab active" data-ltab="create">创建评审</button>
      <button class="ltab" data-ltab="join">加入评审</button>
    </div>
    <form id="createForm" class="landing-form">
      <label>评审名称<input id="cr-title" maxlength="40" placeholder="例如：首页改版方案评审" required></label>
      <div class="two-col">
        <label>我的名字<input id="cr-name" maxlength="16" placeholder="主持人姓名" required></label>
        <label>我的角色
          <select id="cr-role">
            <option value="host">主持人</option>
            <option value="editor">编辑者</option>
          </select>
        </label>
      </div>
      <p class="hint">创建者默认拥有主持人权限，可管理成员、裁决冲突并推进阶段。</p>
      <button class="primary big" type="submit">创建评审空间</button>
    </form>
    <form id="joinForm" class="landing-form" hidden>
      <label>评审 ID（房间号）<input id="jn-room" maxlength="20" placeholder="例如：REV-2026-9F3A" pattern="[A-Za-z0-9-]+" required></label>
      <div class="two-col">
        <label>我的名字<input id="jn-name" maxlength="16" required></label>
        <label>我的角色
          <select id="jn-role">
            <option value="editor">编辑者</option>
            <option value="observer">观察者（仅查看）</option>
          </select>
        </label>
      </div>
      <p class="hint" id="joinHint">加入申请由主持人确认（演示中自动通过，主持人可随后调整身份）。</p>
      <button class="primary big" type="submit">进入空间</button>
    </form>
    <div class="landing-list" id="myReviews"></div>
  </div>
</div>

<!-- 评审空间 -->
<div id="app" class="app" hidden>
  <header class="top">
    <div class="logo"><div class="dot">R</div>
      <div class="title-box">
        <b id="rv-title">评审</b>
        <div class="room">房间 <b id="roomId"></b>
          <button id="copy" class="mini">复制邀请链接</button>
          <button id="exit" class="mini ghost">退出</button>
        </div>
      </div>
    </div>
    <div class="top-right">
      <span id="me-badge" class="me-badge"></span>
      <button id="btn-members" class="ghost">👥 成员 <span id="memberCount" class="count"></span></button>
      <button id="undo" title="撤销本地最近一次画板操作">↶ 撤销</button>
      <button id="export" class="primary">导出 PNG</button>
    </div>
  </header>

  <!-- 阶段门禁条 -->
  <div class="stagebar panel">
    <div class="stages" id="stages"></div>
    <div class="stage-actions">
      <span id="stageHint" class="stage-hint"></span>
      <button id="btn-back" class="ghost" hidden>退回上一阶段</button>
      <button id="btn-advance" class="primary">进入讨论</button>
    </div>
  </div>

  <section class="layout">
    <!-- 左：工具 -->
    <aside class="panel left">
      <h3>画板工具</h3>
      <div class="tools">
        <button class="tool active" data-type="note">▤ 便签</button>
        <button class="tool" data-type="text">T 文本</button>
        <button class="tool" data-type="rect">□ 矩形</button>
        <button class="tool" data-type="circle">○ 圆形</button>
        <button class="tool" data-type="line">╱ 连线</button>
        <button id="select" class="tool">↖ 选择</button>
      </div>
      <div class="divider"></div>
      <h3>便签颜色</h3>
      <div class="color">
        <button class="active" style="background:#fff3bf" data-c="yellow" title="黄"></button>
        <button style="background:#dff3ff" data-c="blue" title="蓝"></button>
        <button style="background:#ffe0eb" data-c="pink" title="粉"></button>
      </div>
      <div class="divider"></div>
      <div class="perm-note" id="permNote"></div>
    </aside>

    <!-- 中：白板 -->
    <section class="board-wrap">
      <div class="board-head">
        <div class="people" id="people"></div>
        <small id="peopleLabel"></small>
        <span id="conflictFlag" class="conflict-flag" hidden>⚠ 有待裁决冲突</span>
        <small id="sync" class="sync-ok" style="margin-left:auto">● 已同步</small>
      </div>
      <div class="board" id="board"></div>
    </section>

    <!-- 右：意见 / 审计 -->
    <aside class="panel right">
      <div class="tabs">
        <button class="rtab active" data-rtab="comments">意见 <span id="cmtCount" class="count"></span></button>
        <button class="rtab" data-rtab="audit">审计 <span id="auditCount" class="count"></span></button>
      </div>

      <div id="tab-comments" class="tab-pane">
        <div class="filter" id="statusFilter">
          <button class="active" data-sf="all">全部</button>
          <button data-sf="open">待处理</button>
          <button data-sf="reviewing">核验中</button>
          <button data-sf="approved">通过</button>
          <button data-sf="rejected">驳回</button>
        </div>
        <button id="btn-add-comment" class="primary full">＋ 提交意见与证据</button>
        <div id="commentList" class="comment-list"></div>
      </div>

      <div id="tab-audit" class="tab-pane" hidden>
        <div id="auditList" class="audit-list"></div>
      </div>
    </aside>
  </section>
</div>

<!-- 意见编辑弹窗 -->
<div id="commentModal" class="modal-mask" hidden>
  <div class="modal">
    <h3 id="cm-title">提交意见</h3>
    <label>意见内容<textarea id="cm-content" rows="3" maxlength="500" placeholder="描述问题或建议……"></textarea></label>
    <div class="two-col">
      <label>负责人
        <select id="cm-owner"></select>
      </label>
      <label>优先级
        <select id="cm-priority">
          <option value="high">高</option>
          <option value="medium" selected>中</option>
          <option value="low">低</option>
        </select>
      </label>
    </div>
    <label>状态（核验/决议阶段使用）
      <select id="cm-status">
        <option value="open">待处理</option>
        <option value="reviewing">核验中</option>
        <option value="approved">通过</option>
        <option value="rejected">驳回</option>
      </select>
    </label>
    <label>证据
      <input type="file" id="cm-file" accept="image/*">
      <small class="hint">支持图片（≤2MB，转存本地）；<span id="cm-evname"></span></label>
    <label class="inline"><input type="checkbox" id="cm-link"> 关联到画板上选中的元素 <span id="cm-linkname" class="hint"></span></label>
    <div class="modal-actions">
      <button id="cm-delete" class="danger ghost" hidden>删除意见</button>
      <span style="flex:1"></span>
      <button class="ghost" data-close>取消</button>
      <button id="cm-save" class="primary">提交</button>
    </div>
  </div>
</div>

<!-- 成员管理弹窗（主持人） -->
<div id="membersModal" class="modal-mask" hidden>
  <div class="modal">
    <h3>评审成员与身份</h3>
    <p class="hint">主持人创建评审并管理身份；编辑者可提交意见、编辑画板；观察者只能查看。</p>
    <div id="memberRows" class="member-rows"></div>
    <div class="modal-actions">
      <span style="flex:1"></span>
      <button class="primary" data-close>完成</button>
    </div>
  </div>
</div>

<!-- 冲突裁决弹窗（主持人） -->
<div id="conflictModal" class="modal-mask" hidden>
  <div class="modal wide">
    <h3>⚠ 元素冲突裁决 <small class="hint" id="cf-sub"></small></h3>
    <p class="hint">两人同时改动了同一元素，系统已保留两个版本。由主持人选择一个版本写入，或在下方合并两个版本后写入。</p>
    <div class="cf-versions">
      <div class="cf-ver">
        <div class="cf-head" id="cf-a-head"></div>
        <textarea id="cf-a" rows="5" readonly></textarea>
        <button id="cf-pick-a" class="full">采用此版本</button>
      </div>
      <div class="cf-ver">
        <div class="cf-head" id="cf-b-head"></div>
        <textarea id="cf-b" rows="5" readonly></textarea>
        <button id="cf-pick-b" class="full">采用此版本</button>
      </div>
    </div>
    <label>合并版本（可编辑两个版本的内容后写入）
      <textarea id="cf-merge" rows="4"></textarea>
    </label>
    <div class="modal-actions">
      <span style="flex:1"></span>
      <button class="ghost" data-close>暂不处理</button>
      <button id="cf-resolve" class="primary">合并后写入</button>
    </div>
  </div>
</div>

<!-- 元素文本编辑弹窗（替代 prompt，兼容窄屏） -->
<div id="editModal" class="modal-mask" hidden>
  <div class="modal">
    <h3>编辑元素文本</h3>
    <textarea id="ed-text" rows="4"></textarea>
    <div class="modal-actions">
      <span style="flex:1"></span>
      <button class="ghost" data-close>取消</button>
      <button id="ed-save" class="primary">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
